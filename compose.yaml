name: softline-pm
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8090"
      BIND_HOST: 0.0.0.0
      PYTHON_BIN: python3
      DATABASE_URL: /app/var/releases.sqlite
    volumes:
      - pmdata:/app/var
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get({host:'127.0.0.1',port:8090,path:'/health',headers:{host:new URL(process.env.APP_BASE_URL).host}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Specify SITE_DOMAIN in .env}
    ports: ["80:80","443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
volumes:
  pmdata:
  caddydata:
  caddyconfig:
