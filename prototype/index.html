<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Релизы · Помощник продакта</title>
  <link rel="stylesheet" href="../dist/report-fonts.css">
  <link rel="stylesheet" href="../web/palette.css">
  <link rel="stylesheet" href="../web/style.css">
  <link rel="stylesheet" href="../web/chat.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="release-prototype">
<div id="release-dashboard">
  <header class="demo-header">
    <strong class="demo-brand">Софтлайн Решения</strong>
    <nav class="top" aria-label="Разделы">
      <button type="button" data-tab="workspace">Обзор</button>
      <button type="button" data-tab="releases" aria-pressed="true">Релизы</button>
    </nav>
    <span class="demo-label">Демонстрационные данные</span>
    <button class="theme-switch" type="button" data-theme-toggle aria-label="Тёмная тема">
      <svg class="theme-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
      <svg class="theme-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      Тема
    </button>
  </header>
  <section class="placeholder" data-slot="workspace" hidden>
    <h2>Демонстрационные релизы</h2>
    <p>Откройте релиз, чтобы сравнить показатели и обсудить результат.</p>
    <button type="button" data-tab="releases">Вернуться к релизам</button>
  </section>
  <section class="release-workspace" data-slot="releases" aria-label="Релизы">
    <div class="view-switch">
      <button type="button" data-toggle="left" aria-controls="release-list">Список релизов</button>
      <button type="button" data-toggle="right" aria-controls="release-chat">Обсуждение</button>
    </div>
    <div class="layout">
      <aside class="sidebar" id="release-list" aria-label="Список релизов">
        <header class="side-heading"><h2>Релизы</h2></header>
        <div class="side-body"><div class="release-list" data-slot="list"></div></div>
      </aside>
      <div class="grip left-grip" role="separator" tabindex="0" aria-label="Ширина списка релизов" aria-orientation="vertical" aria-controls="release-list"></div>
      <main class="dashboard" aria-label="Аналитика релиза">
        <header class="report-head">
          <small class="eyebrow" data-slot="identity"></small>
          <h1 data-slot="title" tabindex="-1"></h1>
          <p class="lead" data-slot="lead"></p>
        </header>
        <div class="filter-area">
          <div class="filters">
            <label>Данные на <select data-filter="date"></select></label>
            <label>Клиенты
              <select data-filter="segment">
                <option value="all">Все клиенты</option>
                <option value="new">Новые клиенты</option>
                <option value="returning">Постоянные клиенты</option>
              </select>
            </label>
          </div>
        </div>
        <p class="period" data-slot="period"></p>
        <div data-slot="charts"></div>
      </main>
      <div class="grip right-grip" role="separator" tabindex="0" aria-label="Ширина обсуждения" aria-orientation="vertical" aria-controls="release-chat"></div>
      <aside class="thread" id="release-chat" aria-label="Обсуждение релиза">
        <div class="conversation-heading">
          <span class="chat-avatar" aria-hidden="true">
            <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="m10 4 2.1 5.9L18 12l-5.9 2.1L10 20l-2.1-5.9L2 12l5.9-2.1L10 4Zm8-2 1 3 3 1-3 1-1 3-1-3-3-1 3-1Z"/></svg>
          </span>
          <div class="conversation-title">
            <h3>Обсуждение релиза</h3>
            <p class="meta" data-slot="chatId"></p>
          </div>
        </div>
        <div class="conversation-body">
          <div class="chat-history" data-slot="messages" role="log" aria-label="Сообщения"></div>
        </div>
        <form class="chat-composer">
          <p class="meta">Примеры ответов по данным релиза</p>
          <div class="composer-row">
            <input aria-label="Вопрос агенту" maxlength="400" required placeholder="Спросить агента…">
            <button class="primary chat-send" type="submit" title="Спросить" aria-label="Спросить" disabled>
              <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 4 18 8-18 8 3-8-3-8Zm4 8h13"/></svg>
            </button>
          </div>
        </form>
      </aside>
    </div>
  </section>
</div>
<script src="data.js"></script>
<script src="metrics.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
