<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Softline Store · Помощник продакта</title>
    <script>
      const root = document.documentElement;
      let theme;
      try { theme = localStorage.getItem('pm-theme'); } catch {}
      if (theme === 'light' || theme === 'dark') root.dataset.themeOverride = 'true';
      else theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      root.dataset.theme = theme;

    </script>
    <style>
      html { background: #f4f5f7; color-scheme: light; }
      html[data-theme="dark"] { background: #151517; color-scheme: dark; }
    </style>
    <link rel="stylesheet" href="/app.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
