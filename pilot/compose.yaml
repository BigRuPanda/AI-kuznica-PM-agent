name: softline-local-pilot
services:
  redmine:
    image: redmine:6.0.12-alpine
    environment:
      REDMINE_DB_DATABASE: sqlite/redmine.db
    volumes:
      - redmine-db:/usr/src/redmine/sqlite
      - redmine-files:/usr/src/redmine/files
      - ./redmine-seed.rb:/tmp/softline-pilot-seed.rb:ro
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/login')).code == '200' ? 0 : 1)"]
      interval: 5s
      timeout: 4s
      retries: 60
  https:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:18443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - redmine-tls:/data
  mail:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
volumes:
  redmine-db:
  redmine-files:
  redmine-tls:
